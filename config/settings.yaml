# ค่าพื้นฐาน: ระยะ mm / m, มุม degree, เวลา second, ความถี่ Hz
# Sharp ใช้ centering; ToF บน Gimbal ใช้ mapping และตรวจด้านหน้า
robot:
  conn_type: ap
  # SDK z command sign relative to yaw telemetry; verify on the physical robot
  yaw_command_sign: -1
  # Reverse drive_speed z after observing heading corrections turn away.
  yaw_speed_command_sign: 1

paths:
  calibration: calibration_output/calibration.json
  telemetry: telemetry_logs
  measurements: data/calibration_measurements.csv
  calibration_output: calibration_output

sensors:
  rate_hz: 20
  history_capacity: 1000
  tof_index: 0
  sharp_left: {board_id: 1, port: 1, adc_index: 0}
  sharp_right: {board_id: 2, port: 2, adc_index: 3}
  sharp_filter: {min_valid: 20, max_valid: 1020, median_window: 5, ema_alpha: 0.35}
  tof_filter: {min_valid: 10, max_valid: 5000, median_window: 5, ema_alpha: 0.40}

navigation:
  grid_size_m: 0.60
  base_speed_mps: 0.425
  step_test_speed_mps: 0.22
  control_rate_hz: 20
  max_heading_error_deg: 15
  max_lateral_deviation_m: 0.15
  nominal_side_mm: 150
  tolerance_mm: 20
  side_wall_threshold_mm: 220
  front_wall_threshold_mm: 250
  front_target_mm: 200
  emergency_front_mm: 155
  front_stop_tolerance_mm: 20
  # Stop immediately on a close ToF reading, then verify with fresh packets.
  obstacle_recheck_timeout_sec: 0.5
  # A ToF wall stop after halfway can finish a cell despite odometry drift
  front_wall_arrival_min_fraction: 0.5
  front_deceleration_mm: 200
  end_deceleration_m: 0.20
  minimum_forward_speed_mps: 0.08
  minimum_front_speed_mps: 0.05
  timeout_multiplier: 1.8
  timeout_extra_sec: 1.5
  align_duration_sec: 0.3
  align_default_duration_sec: 0.4
  step_pause_sec: 1.0
  turn_speed_dps: 90
  turn_settle_sec: 0.30
  # Reference zero every two cells, then restore the arrival heading before scanning
  heading_realign_every_cells: 2
  heading_realign_tolerance_deg: 5
  duration_sec: 0.5

pid:
  lateral: {kp: 0.0005, ki: 0.0001, kd: 0.0, max_speed: 0.04, integral_limit: 30}
  yaw: {kp: 3.0, ki: 0.0, kd: 0.0, max_speed: 90, integral_limit: 20}

telemetry:
  buffer_capacity: 30000

system:
  sensor_warmup_sec: 0.3
  step_test_timeout_sec: 30
  turn_test_timeout_sec: 15

calibration:
  samples: 10
  degrees: {sharp_left: 2, sharp_right: 2, tof: 1}

gimbal:
  test_cycles: 2
  front_yaw_tolerance_deg: 5
  recenter_yaw_speed_dps: 240
  recenter_pitch_speed_dps: 120
  # chassis: turn in place with ToF facing forward; gimbal: requires full yaw range
  scan_mode: gimbal
  pitch_deg: 0
  yaw_speed_dps: 180
  pitch_speed_dps: 60
  settle_sec: 0.25
  action_timeout_sec: 8
  # Other travel segments; left -> right sweep uses one 180-degree move
  move_step_deg: 90
  # One absolute front position command before chassis motion; no feedback trims
  hold_front_on_move: true
  # ToF pivot relative to chassis centre: +x forward, +y right (measure hardware)
  pivot_x_m: 0.0
  pivot_y_m: 0.0
  beam_offset_m: 0.0

fire:
  # Look down while searching and keep the Gimbal tilted down when firing.
  scan_pitch_deg: -20
  # Camera is approximately 4 cm above the barrel. Positive raises the shot.
  camera_above_barrel_m: 0.04
  # Used by the stationary fire test when no wall ToF distance is available.
  default_target_distance_m: 0.25
  # The SDK acknowledges a burst before all three shots have left the blaster.
  # Hold the Gimbal still this long before aiming at another target.
  burst_hold_sec: 1.0
  max_shot_pitch_deg: -5
  # Approximate camera FOV; feedback from new frames corrects the final aim.
  horizontal_fov_deg: 112
  vertical_fov_deg: 80
  # Horizontal fraction of image width accepted around the camera crosshair.
  center_tolerance_fraction: 0.03
  # Adjust after observing actual impact points, especially for water shots.
  yaw_bias_deg: 0.0
  pitch_bias_deg: 0.0
# พิกัดช่อง (row, column): แถวเพิ่มขึ้นด้านบน คอลัมน์เพิ่มไปทางขวา; ไม่ใช่เมตร
# ขนาดและจุดเริ่มไม่กำหนดว่ามีกำแพงที่ใด กำแพงยังต้องสำรวจจาก ToF

map:
  rows: 6
  columns: 6
  start:
    row: 0
    column: 1

slam:
  wall_thickness_m: 0.075
  wall_margin_m: 0.06
  sensor_timeout_sec: 2
  max_sensor_age_sec: 0.3
  # While stationary, allow pose packets to recover before aborting the scan
  scan_pose_recovery_timeout_sec: 2
  scan_samples: 3
  max_cells: 200
  max_moves: 1000
  heading_tolerance_deg: 1
  heading_align_timeout_sec: 3
  # Wait for fresh yaw while the wheels are stopped if feedback briefly drops out
  heading_feedback_recovery_timeout_sec: 2
  startup_settle_sec: 1.0
  stationary_settle_sec: 0.3
  stationary_timeout_sec: 3
  cell_arrival_tolerance_m: 0.10
  localization_gate_m: 0.15
  initial_variance_m2: 0.0025
  motion_variance_m2: 0.0016
  range_variance_m2: 0.0004
  max_pose_std_m: 0.22
  # Global direction indices: 0=N, 1=E, 2=S, 3=W; tie priority N, S, E, W
  direction_order: [0, 2, 1, 3]

# Passive chassis motion check during Gimbal scans; does not rotate the chassis.
scan_guard:
  max_heading_drift_deg: 3
  # Warning threshold only: position drift does not abort a stationary scan
  max_position_drift_m: 0.03
